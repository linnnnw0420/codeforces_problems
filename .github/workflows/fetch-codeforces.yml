name: Fetch Codeforces profile
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write

concurrency:
  group: codeforces-profile-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official Codeforces API data
        run: python scripts/fetch_codeforces.py --handle Linw04207 --out data/codeforces/Linw04207
      - name: Publish data as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeforces-Linw04207
          path: data/codeforces/Linw04207/
          retention-days: 90
      - name: Commit public profile snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codeforces/Linw04207/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Codeforces profile data"
            git push
          fi
